[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "apple-calendar-skill"
version = "0.1.0"
description = "Read-only CLI and agent skill for querying the macOS Apple Calendar (EventKit sqlite) store"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Apple Calendar Skill contributors"}]
keywords = ["apple-calendar", "eventkit", "macos", "agent-skill"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Scheduling",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
apple-calendar = "apple_calendar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_calendar"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]